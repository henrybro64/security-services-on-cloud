apiVersion: v1
kind: ConfigMap
metadata:
  name: security-service-config
  namespace: security-service
data:
  PORT: "8000"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_SSL: "false"
  # Optional – used if your FastAPI app supports CORS_ORIGINS
  # Example: "http://localhost:3000,https://my-frontend.example.com"
  CORS_ORIGINS: "http://localhost:3000"

