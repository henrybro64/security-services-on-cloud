apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service-api
  namespace: security-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-service-api
  template:
    metadata:
      labels:
        app: security-service-api
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: api
          # Image will be set/updated by GitHub Actions (backend-aks.yml)
          # Default image (workflow will patch with specific commit SHA)
          image: securityserviceacr.azurecr.io/security-service-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: security-service-config
            - secretRef:
                name: security-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: security-service-api
  namespace: security-service
spec:
  selector:
    app: security-service-api
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
  # Using static Public IP from Terraform
  # Note: loadBalancerIP works for Azure AKS, though it's deprecated in newer K8s versions.
  loadBalancerIP: 4.241.208.157
