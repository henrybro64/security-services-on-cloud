apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service-api
  namespace: security-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-service-api
  template:
    metadata:
      labels:
        app: security-service-api
    spec:
      containers:
        - name: api
          # 🔴 REPLACE WITH YOUR REAL ACR NAME AND TAG
          # Example: mysecurityacr.azurecr.io/security-service-api:v1
          image: <ACR_NAME>.azurecr.io/security-service-api:<TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: security-service-config
            - secretRef:
                name: security-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: security-service-api
  namespace: security-service
spec:
  selector:
    app: security-service-api
  ports:
    - port: 80
      targetPort: 8000
  # 👉 For AKS we use LoadBalancer to get an external IP
  type: LoadBalancer
