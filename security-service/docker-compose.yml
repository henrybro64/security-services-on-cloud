version: "3.9"

services:
  api:
    build: .
    container_name: security-service-api
    ports:
      - "8000:8000"
    environment:
      # For local dev, Redis is the other container in this compose file
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      # You can add more env vars later (e.g., APP_ENV, LOG_LEVEL)
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: security-service-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
