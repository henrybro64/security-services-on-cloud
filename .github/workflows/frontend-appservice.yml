name: Build and deploy frontend to App Service

on:
  push:
    branches: [ main ]
    paths:
      - "security-frontend/**"
      - ".github/workflows/frontend-appservice.yml"

env:
  # === CHANGE THESE TO MATCH YOUR AZURE RESOURCES ===
  AZURE_WEBAPP_NAME: your-frontend-webapp        # Name of your App Service (from Terraform)
  RESOURCE_GROUP: your-resource-group            # Resource group containing the App Service
  NODE_VERSION: "20"                             # Node.js version (e.g., "18", "20", "22")

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1) Login to Azure
      # Option A: OIDC (recommended) - requires AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
      # Option B: Service Principal - requires AZURE_CREDENTIALS (JSON)
      - name: Azure login
        uses: azure/login@v2
        with:
          # For OIDC (recommended):
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # For Service Principal (alternative - uncomment and comment out above):
          # creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2) Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: security-frontend/package-lock.json

      # 3) Install dependencies
      - name: Install dependencies
        working-directory: ./security-frontend
        run: npm ci

      # 4) Build the Next.js app
      - name: Build Next.js app
        working-directory: ./security-frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build

      # 5) Deploy to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./security-frontend
          startup-command: "npm start"
