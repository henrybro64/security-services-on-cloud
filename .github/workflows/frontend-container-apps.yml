name: Build and deploy frontend to Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - "security-frontend/**"
      - ".github/workflows/frontend-container-apps.yml"

env:
  # Azure resources (from Terraform deployment)
  AZURE_CONTAINER_REGISTRY: securityserviceacr.azurecr.io
  ACR_NAME: securityserviceacr
  RESOURCE_GROUP: securityproj-rg
  IMAGE_NAME: security-frontend
  CONTAINER_APP_NAME: securityproj-frontend

jobs:
  test:
    name: Frontend tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd security-service
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Install Playwright browsers (Python)
        run: |
          python -m playwright install --with-deps chromium

      - name: Start backend API
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_SSL: "false"
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        run: |
          cd security-service
          uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level warning &
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            sleep 3
          done
          echo "API failed to start"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: security-frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd security-frontend
          npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: |
          cd security-frontend
          npm run build

      - name: Start frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          PORT: 3000
        run: |
          cd security-frontend
          npm run start -- --hostname 0.0.0.0 --port 3000 &
          for i in {1..20}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend failed to start"
          exit 1

      - name: Run Playwright UI tests
        env:
          FRONTEND_BASE_URL: http://localhost:3000
          HEADLESS: "true"
        run: |
          cd security-frontend
          pytest tests/playwright/test_frontend_playwright_py.py

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1) Login to Azure using OIDC
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2) Log in to ACR for docker push
      - name: Docker login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # 3) Set up Docker Buildx for registry cache support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4) Build and push the frontend image
      # Using Docker layer caching to speed up builds (saves 5-10 minutes)
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./security-frontend
          push: true
          # Enable build cache to speed up subsequent builds
          cache-from: type=registry,ref=${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          tags: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      # 5) Update Container App with new image and configure registry
      # Note: Container App is created by Terraform with placeholder image (no registry block)
      # This step adds registry authentication and updates the image
      - name: Update Container App with new image
        run: |
          # Add registry configuration for ACR authentication (if not already present)
          echo "Configuring Container App registry authentication..."
          az containerapp registry set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server ${{ env.AZURE_CONTAINER_REGISTRY }} \
            --identity system || echo "Registry may already be configured"
          
          # Update the Container App with the new image
          echo "Updating Container App with new image..."
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Wait for the new revision to be ready (poll until active)
          echo "Waiting for Container App revision to be ready..."
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            # Get the latest revision status
            REVISION_STATUS=$(az containerapp revision list \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "[0].{name:name, active:properties.active, healthState:properties.healthState, trafficWeight:properties.trafficWeight}" \
              -o json 2>/dev/null)
            
            if [ -z "$REVISION_STATUS" ]; then
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Waiting for revision to appear..."
              sleep 5
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi
            
            # Parse JSON (jq is available on GitHub Actions runners)
            ACTIVE=$(echo "$REVISION_STATUS" | jq -r '.active // false')
            HEALTH=$(echo "$REVISION_STATUS" | jq -r '.healthState // "Unknown"')
            
            if [ "$ACTIVE" = "true" ] && [ "$HEALTH" = "Healthy" ]; then
              echo "✅ Container App revision is ready!"
              echo "$REVISION_STATUS" | jq '.'
              break
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Revision not ready yet (active=$ACTIVE, health=$HEALTH)..."
            sleep 5
          done
          
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "⚠️ Warning: Container App revision did not become ready within timeout"
            echo "Showing latest revision status:"
            az containerapp revision list \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              -o table
          fi
     
          
