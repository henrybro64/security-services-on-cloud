name: Build and deploy frontend to Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - "security-frontend/**"
      - ".github/workflows/frontend-container-apps.yml"

env:
  # Azure resources (from Terraform deployment)
  AZURE_CONTAINER_REGISTRY: securityserviceacr.azurecr.io
  ACR_NAME: securityserviceacr
  RESOURCE_GROUP: securityproj-rg
  IMAGE_NAME: security-frontend
  CONTAINER_APP_NAME: securityproj-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1) Login to Azure using OIDC
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2) Log in to ACR for docker push
      - name: Docker login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # 3) Build and push the frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./security-frontend
          push: true
          tags: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      # 4) Update Container App with new image
      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

